# Runs the app locally with one command:  docker compose up --build
# Settings come from .env (copy .env.example). Milestone 1 has only the ML service;
# PostgreSQL, the API and the web app are added in Milestone 2.
services:
  ml-service:
    build: ./ml-service
    environment:
      MODEL_KEY: ${MODEL_KEY:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-8}
      MAX_IMAGE_MEGAPIXELS: ${MAX_IMAGE_MEGAPIXELS:-60}
      INFERENCE_TIMEOUT_S: ${INFERENCE_TIMEOUT_S:-30}
    ports:
      - "${ML_SERVICE_PORT:-8001}:8001"
    restart: unless-stopped
