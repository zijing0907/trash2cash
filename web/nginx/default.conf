# Serves the built web app and proxies /api to the main API, so the browser sees one origin:
# the session cookie stays first-party and no CORS is needed.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Photos up to 8 MB (the API's limit) plus the multipart wrapping
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # The API reads the client IP for rate limiting from here (TRUST_PROXY=true)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header X-Content-Type-Options nosniff always;
    }

    # Vite puts a content hash in every file name under /assets, so they can be cached forever
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Single-page app: unknown paths get index.html and the router decides
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
