# Tool settings only; dependencies are in requirements*.txt (plain pip, no build step needed).

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: common bugs, UP: modern Python syntax
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    # raised inside Keras (not our code) when it converts tensors with NumPy 2
    "ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning",
]
